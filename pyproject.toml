[project]
name = "sw-exel-py-project"
version = "0.1.0"
description = "Excel inventory automation utilities"
authors = [
    {name = "NuyHesHUB",email = "7upbeat7@naver.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.2,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sw_exel_py_project"]
