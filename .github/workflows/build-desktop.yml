name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - feat/desktop-app  # 빌드 구성 검증용 (안정화 후 제거)
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      # uv 관리 Python(독립형 빌드)은 Tcl/Tk 동적 라이브러리를 PyInstaller가
      # 제대로 담지 못하므로, tkinter 번들 실적이 검증된 python.org 공식 빌드를 쓴다.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install . pyinstaller

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CostReport --icon assets/icon.ico desktop_launcher.py

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CostReport --icon assets/icon.icns desktop_launcher.py

      # upload-artifact는 실행 권한을 보존하지 못하므로 macOS .app은 zip으로 묶는다.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r CostReport-macos.zip CostReport.app

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: CostReport-windows
          path: dist/CostReport.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: CostReport-macos
          path: dist/CostReport-macos.zip
